name: android
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list still asks for the removed "tools" package.
          # AGP 8.7.2 with compileSdk 35 needs platform 35 and build-tools 35.0.0.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Choose a signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APK_NOTE=release-signed" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=local-agent debug"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "APK_NOTE=debug-signed (release keystore secrets were not all set)" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        working-directory: apps/mobile/android
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          tag="main-${short}"
          apk="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "local-agent-${short}.apk"
          note="Native Android app (Jetpack Compose / Material 3). ${APK_NOTE}."
          # The Windows workflow publishes the same tag. Create the release, or upload if it already exists.
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "local-agent-${short}.apk" --clobber
              body="$(gh release view "$tag" --json body --jq .body)"
              case "$body" in
                *"$note"*) ;;
                *) gh release edit "$tag" --notes "${body}"$'\n\n'"${note}" ;;
              esac
              exit 0
            fi
            if gh release create "$tag" "local-agent-${short}.apk" \
              --title "local-agent ${short}" \
              --latest \
              --notes "$note"; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not publish ${tag}" >&2
          exit 1
