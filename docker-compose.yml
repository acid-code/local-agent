services:
  local-agent:
    build: .
    ports:
      - "${LA_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: /data
      LA_HOST: 0.0.0.0
      LA_PORT: 8787
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      LLAMA_SERVER_URL: ${LLAMA_SERVER_URL:-http://host.docker.internal:8080/v1}
      LLAMA_UNCENSORED_SERVER_URL: ${LLAMA_UNCENSORED_SERVER_URL:-http://host.docker.internal:8081/v1}
      LLAMA_FALLBACK_CONTROL_URL: ${LLAMA_FALLBACK_CONTROL_URL:-http://host.docker.internal:8082}
      LLAMA_FALLBACK_TOKEN: ${LLAMA_FALLBACK_TOKEN:-}
      LA_OLLAMA_PINNED: ${LA_OLLAMA_PINNED:-none}
      LA_OLLAMA_MAX_LOADED: ${LA_OLLAMA_MAX_LOADED:-1}
      LA_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-local-agent}
      LA_HOST_DATA_DIR: ${DATA_DIR:-/opt/local-agent/data}
      LA_PROJECTS_DIR: /data/workspaces/projects
      LA_WORKBENCH_IMAGE: ${LA_WORKBENCH_IMAGE:-la-workbench:latest}
      LA_DISABLE_SETUP: "1"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    # Uncomment on the mini PC so the container can see the Radeon iGPU.
    # devices:
    #   - /dev/dri:/dev/dri
    #   - /dev/kfd:/dev/kfd

  # Host network so the setup page sees real client addresses and can bind
  # only to LAN interfaces. It is not published on 0.0.0.0.
  setup:
    build: .
    network_mode: host
    environment:
      DATA_DIR: /data
      LA_SETUP_ONLY: "1"
      LA_SETUP_PORT: "8788"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
      LA_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-local-agent}
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  whisper:
    profiles: ["voice"]
    image: fedirz/faster-whisper-server:latest-cpu
    ports:
      - "8091:8000"
    restart: unless-stopped

  kokoro:
    profiles: ["voice"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    restart: unless-stopped
