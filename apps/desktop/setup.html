<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>local-agent</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Segoe UI", system-ui, sans-serif; background: #0b0b0c; color: #f4f0e6; }
      main { width: min(32rem, calc(100vw - 2rem)); padding: 2rem; background: #111318; border: 1px solid rgba(243,236,223,.08); border-radius: 12px; }
      h1 { font-weight: 560; letter-spacing: -0.03em; margin: 0 0 .5rem; display: flex; align-items: center; gap: .6rem; }
      p { color: #b7b1a6; line-height: 1.5; margin: .5rem 0; }
      label { display: block; margin: 1.2rem 0 0.4rem; color: #b7b1a6; font-size: .9rem; }
      input { width: 100%; background: #090a0c; color: inherit; font: inherit; border: 1px solid rgba(243,236,223,.16); border-radius: 12px; padding: 0.75rem .9rem; outline: none; }
      input:focus { border-color: #e4b56a; box-shadow: 0 0 0 3px rgba(228,181,106,.2); }
      .actions { display: flex; align-items: center; gap: .8rem; margin-top: 1.2rem; flex-wrap: wrap; }
      button { background: #e4b56a; color: #1a140c; border: 0; border-radius: 999px; padding: 0.75rem 1.3rem; font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; }
      button:hover { background: #f3d7a6; }
      button:focus-visible { outline: 2px solid #f3d7a6; outline-offset: 2px; }
      button:disabled { opacity: .6; cursor: wait; }
      .chips { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem; }
      .chip { background: transparent; color: #b7b1a6; border: 1px solid rgba(243,236,223,.16); padding: .35rem .8rem; min-height: 32px; font-weight: 400; font-size: .85rem; }
      .chip:hover { background: #181b22; color: #f4f0e6; }
      .hint { font-size: .85rem; color: #8a847a; }
      .warn { color: #f3d7a6; }
      #note:empty { display: none; }
      #note { background: rgba(227,148,134,.1); border: 1px solid rgba(227,148,134,.4); color: #f0b7ac; border-radius: 12px; padding: .7rem .9rem; overflow-wrap: anywhere; }
      /* Frameless window: the page itself is the drag handle; controls stay clickable. */
      body { -webkit-app-region: drag; padding-top: 40px; }
      input, button, a, select, textarea, label { -webkit-app-region: no-drag; }
    </style>
  </head>
  <body>
    <main>
      <h1><svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="18" fill="none" stroke="#e4b56a" stroke-width="4"/><circle cx="32" cy="32" r="5" fill="#e4b56a"/></svg>local-agent</h1>
      <p>Point this window at the server. At home that is the LAN address. On this PC, with the server in WSL, it is <span class="warn">http://127.0.0.1:8787</span>.</p>
      <p id="note" role="alert"></p>
      <form id="setup">
        <label for="url">Server URL</label>
        <input id="url" name="url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="http://192.168.1.20:8787" required autofocus />
        <div class="chips">
          <button type="button" class="chip" data-url="http://127.0.0.1:8787">This PC (WSL)</button>
        </div>
        <div class="actions">
          <button type="submit" id="go">Open the console</button>
          <span class="hint">Change it later from Server → Change server…</span>
        </div>
      </form>
      <p class="hint">The login cookie stays in this app.</p>
      <p class="hint" id="app-version">Checking app version…</p>
      <button type="button" class="chip" id="check-update">Check for updates</button>
    </main>
    <script>
      const input = document.querySelector('#url');
      const note = document.querySelector('#note');
      const params = new URLSearchParams(location.search);
      if (params.get('error')) note.textContent = params.get('error');
      window.localAgent.getUrl().then((url) => {
        if (url) input.value = url;
      });
      window.localAgent.getAppInfo().then((info) => {
        document.querySelector('#app-version').textContent = `local-agent ${info.version}${info.packaged ? '' : ' · development build'}`;
      }).catch(() => {});
      const describe = (s) => ({
        development: 'Development build: updates are off.',
        checking: 'Checking for updates…',
        'up-to-date': 'You are up to date.',
        downloading: `Downloading ${s.version || 'update'}… ${s.percent || 0}%`,
        downloaded: `Version ${s.version} is ready. Restart to install.`,
        'portable-available': `Version ${s.version} is out. Download it from the release page.`,
        error: s.error || 'Update check failed.',
      })[s.state] || '';
      window.localAgent.onUpdateStatus?.((s) => { note.textContent = describe(s); });
      document.querySelector('#check-update').addEventListener('click', async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        button.textContent = 'Checking…';
        const result = await window.localAgent.checkForUpdates();
        button.disabled = false;
        button.textContent = 'Check for updates';
        if (!result.ok) note.textContent = result.error || 'Update check failed.';
        else note.textContent = describe(result.result || {});
      });
      const go = document.querySelector('#go');
      document.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => { input.value = chip.dataset.url; input.focus(); }));
      document.querySelector('#setup').addEventListener('submit', async (event) => {
        event.preventDefault();
        let value = input.value.trim();
        if (value && !/^https?:\/\//i.test(value)) value = `http://${value}`;
        input.value = value;
        note.textContent = '';
        go.disabled = true;
        go.textContent = 'Connecting…';
        const result = await window.localAgent.setUrl(value);
        if (!result.ok) {
          note.textContent = result.error || 'That URL was not saved.';
          go.disabled = false;
          go.textContent = 'Open the console';
        }
      });
    </script>
  </body>
</html>
